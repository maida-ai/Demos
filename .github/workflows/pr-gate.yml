name: PR Gate Demo

on:
  pull_request:
    paths:
      - "pr-gate/**"
      - ".github/workflows/pr-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  tests:
    name: Safe and regressed demo workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pr-gate/uv.lock"

      - name: Install locked environment
        run: uv sync --directory pr-gate --locked --dev

      - name: Run project tests
        run: uv run --directory pr-gate --frozen python -m pytest -q

      - name: Check formatting and lint
        run: |
          uv run --directory pr-gate --frozen ruff check .
          uv run --directory pr-gate --frozen ruff format --check .

  maida:
    name: Intentional regression demonstration (expected FAIL)
    # PR CI asserts the safe and deliberately regressed outcomes in isolation.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pr-gate/uv.lock"

      # The Action runs the agent outside the uv project environment. Its full
      # unittest discovery also imports the pytest-based harness modules.
      - name: Set up the Action Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies for the agent subprocess
        run: |
          uv export --directory pr-gate --locked --all-groups --no-emit-project --output-file "$RUNNER_TEMP/pr-gate-requirements.txt" > /dev/null
          uv pip install --python "$(command -v python)" --requirements "$RUNNER_TEMP/pr-gate-requirements.txt"

      - name: Run Maida regression gate
        uses: maida-ai/maida-assert@e196bc38c47c5b55b91964c99ec272bc783f253e # v5
        with:
          agent-script: pr-gate/coding_agent.py
          baseline: pr-gate/.maida/baselines/coding-agent.json
          policy: pr-gate/.maida/policy.yaml
          maida-version: "@e69109354f881758d32c4d659fe368ba04049fa2"
          python-version: "3.13"
          post-comment: "true"
