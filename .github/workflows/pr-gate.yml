name: PR Gate Demo

on:
  pull_request:
    paths:
      - "pr-gate/**"
      - ".github/workflows/pr-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  tests:
    name: Conventional tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pr-gate/uv.lock"

      - name: Install locked environment
        run: uv sync --directory pr-gate --locked

      - name: Run project tests
        run: uv run --directory pr-gate --frozen pytest -q

      - name: Check formatting and lint
        run: |
          uv run --directory pr-gate --frozen ruff check .
          uv run --directory pr-gate --frozen ruff format --check .

  maida:
    name: Maida agent regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pr-gate/uv.lock"

      - name: Validate locked environment
        run: uv sync --directory pr-gate --locked

      - name: Run Maida regression gate
        uses: maida-ai/maida-assert@8d21c10aa2ea0ee59aca4afd8bb79fb3e320038c
        with:
          agent-script: pr-gate/coding_agent.py
          baseline: pr-gate/.maida/baselines/coding-agent.json
          policy: pr-gate/.maida/policy.yaml
          maida-version: "@d141fe1596f66f793afe71e05492fefc064cfb7b"
          python-version: "3.13"
          post-comment: "true"
